<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menonton — Anvi Create</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1f1f1f;
  --red: #e50914; --text: #fff;
  --text-dim: rgba(255,255,255,0.65); --text-muted: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  opacity: 0; animation: fadeIn 0.5s ease forwards;
  overflow-x: hidden;
}
@keyframes fadeIn { to { opacity: 1; } }

/* HEADER */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: 64px; padding: 0 4%;
  display: flex; align-items: center; gap: 16px;
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 2px;
  color: var(--red); cursor: pointer;
  text-decoration: none;
}
.sep { color: var(--text-muted); font-size: 18px; }
#navTitle {
  font-size: 14px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.close-btn {
  margin-left: auto;
  background: none; border: 1px solid var(--border);
  color: var(--text-dim); padding: 7px 18px; border-radius: 4px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.close-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }

/* MAIN */
.main { padding-top: 64px; }

.player-wrap {
  width: 100%; background: #000;
  position: relative;
}
.video-box {
  width: 100%; max-width: 1280px;
  margin: 0 auto; padding: 0 4%;
  padding-top: 24px;
}
.video-frame {
  position: relative; width: 100%; padding-top: 56.25%;
  background: #000; border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.video-frame iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none;
}
.video-frame iframe:fullscreen,
.video-frame iframe:-webkit-full-screen,
.video-frame iframe:-moz-full-screen {
  width: 100vw; height: 100vh;
}
.loader {
  position: absolute; inset: 0; background: #000; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
.spin {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--red);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* INFO */
.info-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 32px 4%;
  display: grid; grid-template-columns: 1fr auto;
  gap: 40px; align-items: start;
  animation: slideUp 0.5s ease both 0.2s;
  opacity: 0;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.info-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 4vw, 46px);
  letter-spacing: 1px; margin-bottom: 10px;
}
.info-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tag {
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 2px; letter-spacing: 0.5px;
}
.tag-type { background: var(--red); color: #fff; }
.tag-quality { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

.server-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
}
.servers { display: flex; gap: 8px; flex-wrap: wrap; }
.srv {
  padding: 8px 20px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.srv:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
.srv.active { background: var(--red); border-color: var(--red); color: #fff; }
.srv.trailer {
  border-color: rgba(255,200,0,0.3); color: #ffc800;
  display: none; align-items: center; gap: 7px;
}
.srv.trailer.show { display: flex; }
.srv.trailer:hover { border-color: #ffc800; background: rgba(255,200,0,0.08); }
.srv.trailer.active { background: #ffc800; border-color: #ffc800; color: #000; }
.srv.trailer svg { width: 13px; height: 13px; fill: currentColor; }

/* DETAIL */
.detail-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 0 4% 32px;
  animation: slideUp 0.5s ease both 0.28s;
  opacity: 0; border-bottom: 1px solid var(--border);
}
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
@media(max-width: 768px) { .detail-grid { grid-template-columns: 1fr; gap: 24px; } }
.detail-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
}
.detail-desc { font-size: 14px; line-height: 1.8; color: var(--text-dim); }
.detail-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.btn-expand {
  background: none; border: none; color: var(--red);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
  font-weight: 600; cursor: pointer; padding: 8px 0 0; transition: opacity 0.2s;
}
.btn-expand:hover { opacity: 0.8; }
.detail-meta { display: flex; flex-direction: column; gap: 12px; }
.meta-row { display: flex; gap: 10px; align-items: baseline; }
.meta-label { font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 70px; }
.meta-value { font-size: 13px; color: var(--text-dim); }
.genre-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.genre-tag { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); font-size: 11px; font-weight: 600; color: var(--text-dim); }
.share-wrap { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn-share {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-share:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
.btn-share.wa { border-color: rgba(37,211,102,0.3); color: #25d366; }
.btn-share.wa:hover { background: rgba(37,211,102,0.08); }

/* CAST */
.cast-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 4% 32px;
  animation: slideUp 0.5s ease both 0.32s;
  opacity: 0; border-bottom: 1px solid var(--border);
}
.cast-scroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.cast-scroll::-webkit-scrollbar { display: none; }
.cast-card { flex: 0 0 90px; text-align: center; }
.cast-photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; border: 2px solid var(--border); display: block; background: var(--surface2); }
.cast-placeholder { width: 72px; height: 72px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; }
.cast-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-char { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* RECS */
.rec-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 0 4% 80px;
  animation: slideUp 0.5s ease both 0.35s;
  opacity: 0;
}
.rec-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 8px;
}
.rec-card {
  cursor: pointer; border-radius: 4px; overflow: hidden;
  transition: transform 0.25s;
}
.rec-card:hover { transform: scale(1.04); }
.rec-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
.rec-card-name {
  background: var(--surface); padding: 8px 10px;
  font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.fade-out { animation: fadeOut 0.35s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }

@media(max-width: 768px) {
  .video-box { padding: 0; }
  .video-frame { border-radius: 0; }
  .info-wrap { grid-template-columns: 1fr; gap: 24px; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">ANVI</a>
  <span class="sep">/</span>
  <span id="navTitle">Memuat…</span>
  <a href="index.html" class="close-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    Tutup
  </a>
</header>

<div class="main">
  <div class="player-wrap">
    <div class="video-box">
      <div class="video-frame">
        <div class="loader" id="loader"><div class="spin"></div></div>
        <div id="playerFrame"></div>
      </div>
    </div>
  </div>

  <div class="info-wrap">
    <div>
      <div class="info-title" id="vTitle">Memuat…</div>
      <div class="info-tags">
        <span class="tag tag-type" id="vType">Video</span>
        <span class="tag tag-quality">HD</span>
      </div>
      <div class="server-label">Pilih Server</div>
      <div class="servers" id="srvList">
        <button class="srv trailer" id="trailerBtn" onclick="playTrailer()">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Trailer
        </button>
      </div>
    </div>
  </div>

  <div class="detail-wrap" id="detailWrap" style="display:none">
    <div class="detail-grid">
      <div>
        <div class="detail-section-title">Sinopsis</div>
        <div class="detail-desc collapsed" id="detailDesc">—</div>
        <button class="btn-expand" id="btnExpand" onclick="toggleDesc()">Selengkapnya ▾</button>
        <div class="share-wrap">
          <button class="btn-share wa" onclick="shareWA()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.096.541 4.064 1.487 5.785L.057 23.176a.75.75 0 0 0 .92.92l5.442-1.425A11.934 11.934 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.907 0-3.686-.516-5.214-1.415l-.372-.219-3.862 1.013 1.036-3.77-.239-.386A9.953 9.953 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
            WhatsApp
          </button>
          <button class="btn-share" onclick="copyLink()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Salin Link
          </button>
        </div>
      </div>
      <div class="detail-meta" id="detailMeta"></div>
    </div>
  </div>

  <div class="cast-wrap" id="castWrap" style="display:none">
    <div class="detail-section-title">Pemeran</div>
    <div class="cast-scroll" id="castList"></div>
  </div>

  <div class="rec-wrap">
    <div class="rec-title">Mungkin Kamu Suka</div>
    <div class="rec-grid" id="recGrid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xvktodveoxnuelhtzaog.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2a3RvZHZlb3hudWVsaHR6YW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzEzMjAsImV4cCI6MjA4NTM0NzMyMH0.WUvB6oKtKxxgO-5z0SH8uBUQx9c3Gn6r170qxGeKWTI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TMDB_KEY = '7bb2587bb70323fa478264264f16fcc7';
const TMDB_API = 'https://api.themoviedb.org/3';
let trailerKey = null; // YouTube video key dari TMDB
const params = new URLSearchParams(location.search);

function goto(url) {
  document.body.classList.add('fade-out');
  setTimeout(() => location.href = url, 320);
}

async function init() {
  let data = null, title = '';
  const movieId = params.get('id');
  const episodeId = params.get('episode');

  if (movieId) {
    const r = await sb.from('Movies').select('*').eq('id', movieId).single();
    if (r.data) { data = r.data; title = r.data.title; document.getElementById('vType').innerText = 'Film'; }
  } else if (episodeId) {
    const r = await sb.from('Episodes').select('*, Series(id, title, thumb)').eq('id', episodeId).single();
    if (r.data) { data = r.data; title = `${r.data.Series.title} — Eps ${r.data.episode}`; document.getElementById('vType').innerText = 'Series'; }
  }

  if (!data) {
    document.getElementById('vTitle').innerText = 'Video tidak ditemukan.';
    setTimeout(() => goto('index.html'), 2000);
    return;
  }

  document.title = title + ' — Anvi';
  document.getElementById('navTitle').innerText = title;
  document.getElementById('vTitle').innerText = title;

  const servers = [{ n: 'Server 1', u: data.video }];
  if (data.video2) servers.push({ n: 'Server 2', u: data.video2 });

  servers.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'srv' + (i === 0 ? ' active' : '');
    b.innerText = s.n;
    b.onclick = () => {
      play(s.u);
      document.querySelectorAll('.srv').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('trailerBtn').classList.remove('active');
    };
    document.getElementById('srvList').appendChild(b);
  });

  play(data.video);
  loadRecs();
  loadTrailer(title, !!movieId);

  // ── Increment view_count via RPC (bypass RLS) ──
  if (movieId) {
    sb.rpc('increment_view_count', { table_name: 'Movies', row_id: Number(movieId) }).then();
  } else if (episodeId && data.series_id) {
    sb.rpc('increment_view_count', { table_name: 'Series', row_id: Number(data.series_id) }).then();
  }

  // ── Track for "Continue Watching" — skip konten 18+ ──
  if (!data.is18) {
    const cwType = movieId ? 'movie' : 'episode';
    const cwId    = movieId ? movieId : data.series_id;
    const cwThumb = movieId ? data.thumb : (data.Series?.thumb || '');
    const cwTitle = movieId ? title : data.Series?.title || title;
    const cwUrl   = movieId
      ? `player.html?id=${movieId}`
      : `series.html?id=${data.series_id}`;

    let cw = JSON.parse(localStorage.getItem('anvi_continue') || '[]').filter(i => i.id !== cwId);
    cw.unshift({ id: cwId, title: cwTitle, thumb: cwThumb, type: cwType, url: cwUrl, progress: 5 });
    cw = cw.slice(0, 8);
    localStorage.setItem('anvi_continue', JSON.stringify(cw));

    // Update progress setiap 15 detik
    let prog = 5;
    const progTimer = setInterval(() => {
      prog = Math.min(prog + 1, 95);
      let stored = JSON.parse(localStorage.getItem('anvi_continue') || '[]');
      const idx = stored.findIndex(i => i.id === cwId);
      if (idx > -1) { stored[idx].progress = prog; localStorage.setItem('anvi_continue', JSON.stringify(stored)); }
    }, 15000);
  }
}

function play(url) {
  const loader = document.getElementById('loader');
  loader.style.opacity = '1'; loader.style.display = 'flex';

  let u = url.trim();
  let iframeHtml = '';

  // ── Deteksi apakah input adalah embed code (<iframe ...>) ──
  if (u.startsWith('<iframe') || u.startsWith('<IFRAME')) {
    // Pakai langsung embed code-nya apa adanya
    iframeHtml = u;
  } else {
    // ── Input adalah URL biasa, konversi ke embed ──
    let extra = '';

    if (u.includes('streamtape.com')) {
      u = u.replace('/v/', '/e/').replace('/watch/', '/e/');
    }
    else if (u.includes('filemoon.sx') || u.includes('filemoon.in')) {
      u = u.replace('/d/', '/e/').replace('/f/', '/e/');
    }
    else if (u.match(/dood\.(to|la|sh|watch|pm|re|yt|stream)/)) {
      u = u.replace(/\/(d|f|watch)\//, '/e/');
    }
    else if (u.includes('streamwish.com') || u.includes('strwish.com')) {
      u = u.replace('/f/', '/e/').replace('/d/', '/e/');
    }
    else if (u.includes('seekstreaming.com')) {
      u = u.replace('/f/', '/e/').replace('/d/', '/e/');
    }
    else if (u.includes('pixeldrain.com')) {
      const id = u.split('/u/')[1]?.split('?')[0];
      if (id) u = `https://pixeldrain.com/api/file/${id}?download`;
    }
    else if (u.includes('drive.google.com')) {
      u = u.replace('/view', '/preview').replace('/edit', '/preview');
    }
    else if (u.includes('gdriveplayer')) {
      extra = 'referrerpolicy="no-referrer"';
    }

    iframeHtml = `<iframe src="${u}" frameborder="0" scrolling="0" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" ${extra}></iframe>`;
  }

  document.getElementById('playerFrame').innerHTML = iframeHtml;

  setTimeout(() => {
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
  }, 1800);
}

async function loadRecs() {
  const { data } = await sb.from('Movies').select('*').eq('is18', false).limit(8);
  const grid = document.getElementById('recGrid');
  data?.forEach(r => {
    grid.innerHTML += `
      <div class="rec-card" onclick="goto('player.html?id=${r.id}')">
        <img src="${r.thumb}" loading="lazy" alt="${r.title}">
        <div class="rec-card-name">${r.title}</div>
      </div>`;
  });
}

async function loadTrailer(title, isMovie) {
  try {
    const cleanTitle = title.replace(/\s*\(\d{4}\)\s*$/, '').trim();
    const year = (title.match(/\((\d{4})\)/) || [])[1] || '';
    const type = isMovie ? 'movie' : 'tv';

    // Search TMDB
    const sRes = await fetch(`${TMDB_API}/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanTitle)}${year ? '&year='+year : ''}`);
    const sData = await sRes.json();
    const first = sData.results?.[0];
    if (!first) return;

    // Fetch detail + credits + videos sekaligus
    const [detailRes, creditsRes, videosRes] = await Promise.all([
      fetch(`${TMDB_API}/${type}/${first.id}?api_key=${TMDB_KEY}&language=id-ID`),
      fetch(`${TMDB_API}/${type}/${first.id}/credits?api_key=${TMDB_KEY}&language=id-ID`),
      fetch(`${TMDB_API}/${type}/${first.id}/videos?api_key=${TMDB_KEY}`)
    ]);
    const detail  = await detailRes.json();
    const credits = await creditsRes.json();
    const videos  = await videosRes.json();

    // ── Trailer ──
    const trailer = (videos.results||[]).find(v => v.site==='YouTube' && v.type==='Trailer')
                 || (videos.results||[]).find(v => v.site==='YouTube' && v.type==='Teaser')
                 || (videos.results||[]).find(v => v.site==='YouTube');
    if (trailer) {
      trailerKey = trailer.key;
      document.getElementById('trailerBtn').classList.add('show');
    }

    // ── Detail Info ──
    const desc    = detail.overview || '';
    const genres  = (detail.genres||[]).map(g => g.name).join(', ');
    const releaseY = (detail.release_date || detail.first_air_date || '').slice(0,4);
    const runtime = detail.runtime ? `${detail.runtime} menit` : (detail.episode_run_time?.[0] ? `${detail.episode_run_time[0]} menit/eps` : '—');
    const rating  = detail.vote_average ? detail.vote_average.toFixed(1) + ' / 10' : '—';
    const director = (credits.crew||[]).find(c => c.job === 'Director')?.name || '—';

    if (desc) {
      document.getElementById('detailDesc').innerText = desc;
      document.getElementById('detailWrap').style.display = 'block';

      // Meta info
      const meta = document.getElementById('detailMeta');
      meta.innerHTML = `
        ${releaseY ? `<div class="meta-row"><span class="meta-label">Tahun</span><span class="meta-value">${releaseY}</span></div>` : ''}
        ${genres ? `<div class="meta-row"><span class="meta-label">Genre</span><div class="genre-tags">${genres.split(', ').map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div></div>` : ''}
        <div class="meta-row"><span class="meta-label">Durasi</span><span class="meta-value">${runtime}</span></div>
        <div class="meta-row"><span class="meta-label">Rating</span><span class="meta-value">⭐ ${rating}</span></div>
        ${director !== '—' ? `<div class="meta-row"><span class="meta-label">Sutradara</span><span class="meta-value">${director}</span></div>` : ''}
      `;
    }

    // ── Cast ──
    const cast = (credits.cast||[]).slice(0, 15);
    if (cast.length) {
      const castList = document.getElementById('castList');
      cast.forEach((c, i) => {
        const photo = c.profile_path ? `https://image.tmdb.org/t/p/w185${c.profile_path}` : '';
        castList.innerHTML += `
          <div class="cast-card" style="animation-delay:${i*0.04}s">
            ${photo
              ? `<img class="cast-photo" src="${photo}" loading="lazy" alt="${c.name}">`
              : `<div class="cast-placeholder">👤</div>`}
            <div class="cast-name">${c.name}</div>
            <div class="cast-char">${c.character || ''}</div>
          </div>`;
      });
      document.getElementById('castWrap').style.display = 'block';
    }

  } catch(e) {
    console.log('TMDB error:', e.message);
  }
}

// ── DESC EXPAND ──
let descExpanded = false;
function toggleDesc() {
  descExpanded = !descExpanded;
  const el = document.getElementById('detailDesc');
  const btn = document.getElementById('btnExpand');
  el.classList.toggle('collapsed', !descExpanded);
  btn.innerText = descExpanded ? 'Lebih Sedikit ▴' : 'Selengkapnya ▾';
}

// ── SHARE ──
function shareWA() {
  const text = `Tonton "${document.getElementById('vTitle').innerText}" di Anvi Create: ${location.href}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = event.target.closest('.btn-share');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Tersalin!';
    setTimeout(() => btn.innerHTML = orig, 2000);
  });
}

function playTrailer() {
  if (!trailerKey) return;
  document.querySelectorAll('.srv').forEach(x => x.classList.remove('active'));
  document.getElementById('trailerBtn').classList.add('active');
  document.getElementById('playerFrame').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${trailerKey}?autoplay=1" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
}

init();
</script>
</body>
</html>
