<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menonton — Anvi Create</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1f1f1f;
  --red: #e50914; --text: #fff;
  --text-dim: rgba(255,255,255,0.65); --text-muted: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  opacity: 0; animation: fadeIn 0.5s ease forwards;
  overflow-x: hidden;
}
@keyframes fadeIn { to { opacity: 1; } }

/* HEADER */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: 64px; padding: 0 4%;
  display: flex; align-items: center; gap: 16px;
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 2px;
  color: var(--red); cursor: pointer;
  text-decoration: none;
}
.sep { color: var(--text-muted); font-size: 18px; }
#navTitle {
  font-size: 14px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.close-btn {
  margin-left: auto;
  background: none; border: 1px solid var(--border);
  color: var(--text-dim); padding: 7px 18px; border-radius: 4px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.close-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }

/* MAIN */
.main { padding-top: 64px; }

.player-wrap {
  width: 100%; background: #000;
  position: relative;
}
.video-box {
  width: 100%; max-width: 1280px;
  margin: 0 auto; padding: 0 4%;
  padding-top: 24px;
}
.video-frame {
  position: relative; width: 100%; padding-top: 56.25%;
  background: #000; border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.video-frame iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none;
}
.video-frame iframe:fullscreen,
.video-frame iframe:-webkit-full-screen,
.video-frame iframe:-moz-full-screen {
  width: 100vw; height: 100vh;
}
.loader {
  position: absolute; inset: 0; background: #000; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
.spin {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--red);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* INFO */
.info-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 32px 4%;
  display: grid; grid-template-columns: 1fr auto;
  gap: 40px; align-items: start;
  animation: slideUp 0.5s ease both 0.2s;
  opacity: 0;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.info-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 4vw, 46px);
  letter-spacing: 1px; margin-bottom: 10px;
}
.info-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tag {
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 2px; letter-spacing: 0.5px;
}
.tag-type { background: var(--red); color: #fff; }
.tag-quality { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

.server-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
}
.servers { display: flex; gap: 8px; flex-wrap: wrap; }
.srv {
  padding: 8px 20px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.srv:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
.srv.active { background: var(--red); border-color: var(--red); color: #fff; }
.srv.trailer {
  border-color: rgba(255,200,0,0.3); color: #ffc800;
  display: none; align-items: center; gap: 7px;
  padding: 9px 14px; border-radius: 8px; height: 38px; white-space: nowrap;
}
.srv.trailer.show { display: inline-flex; }
.srv.trailer:hover { border-color: #ffc800; background: rgba(255,200,0,0.08); }
.srv.trailer.active { background: #ffc800; border-color: #ffc800; color: #000; }
.srv.trailer svg { width: 13px; height: 13px; fill: currentColor; }

/* KONTROL SERVER & SUBTITLE (DROPDOWN) */
.player-controls-row {
  display: flex; flex-wrap: wrap; gap: 16px 28px;
  margin-top: 20px; align-items: flex-end;
}
.control-group {
  display: flex; flex-direction: column; gap: 7px;
}
.control-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px;
}
.control-input-wrap {
  display: flex; align-items: center; gap: 8px;
}
.select-wrapper {
  position: relative; min-width: 220px;
}
@media(max-width: 600px) {
  .player-controls-row {
    flex-direction: column; align-items: stretch; gap: 14px;
  }
  .control-group, .control-input-wrap { width: 100%; }
  .select-wrapper { flex: 1; min-width: 0; }
}
.custom-select {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background: var(--surface2); border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px; color: #ffffff;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600;
  padding: 9px 34px 9px 13px; width: 100%; height: 38px;
  cursor: pointer; transition: all 0.2s ease; outline: none;
}
.custom-select:hover { border-color: rgba(0, 210, 255, 0.45); }
.custom-select:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2); }
.custom-select option { background: #12121a; color: #ffffff; padding: 8px 12px; }
.select-arrow {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
}
.select-arrow svg { width: 15px; height: 15px; fill: rgba(255, 255, 255, 0.65); }
.btn-sub-upload {
  background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.25);
  border-radius: 8px; color: var(--text-dim);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600;
  padding: 9px 13px; cursor: pointer; white-space: nowrap;
  transition: all 0.2s ease; height: 38px;
  display: flex; align-items: center; justify-content: center;
}
.btn-sub-upload:hover { border-color: var(--cyan); color: #ffffff; background: rgba(0, 210, 255, 0.08); }

.sub-status-badge {
  font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0.5px;
  color: var(--cyan); background: rgba(0, 210, 255, 0.12);
  border: 1px solid rgba(0, 210, 255, 0.3); padding: 2px 8px; border-radius: 4px;
}
.sub-overlay {
  position: absolute;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  width: max-content;
  text-align: center;
  pointer-events: none;
  z-index: 9;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.sub-overlay.visible {
  display: flex;
  opacity: 1;
}
.sub-line {
  display: inline-block;
  color: #ffffff;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  font-size: clamp(16px, 2.6vw, 26px);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: 0.01em;
  text-shadow:
    0 0 6px rgba(0,0,0,1),
    0 2px 6px rgba(0,0,0,0.95),
    -1px -1px 0 rgba(0,0,0,0.8),
     1px -1px 0 rgba(0,0,0,0.8),
    -1px  1px 0 rgba(0,0,0,0.8),
     1px  1px 0 rgba(0,0,0,0.8);
  background: rgba(0, 0, 0, 0.72);
  padding: 5px 18px;
  border-radius: 6px;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  max-width: 100%;
}
::cue, video::cue {
  background-color: transparent !important;
  color: transparent !important;
  text-shadow: none !important;
}
:fullscreen .sub-overlay,
:-webkit-full-screen .sub-overlay {
  bottom: 88px;
}
:fullscreen .sub-line,
:-webkit-full-screen .sub-line {
  font-size: clamp(20px, 3.2vw, 36px) !important;
  padding: 7px 24px !important;
}
:fullscreen ::cue, video:fullscreen::cue,
:-webkit-full-screen ::cue, video:-webkit-full-screen::cue {
  background-color: rgba(0, 0, 0, 0.78) !important;
  color: #ffffff !important;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
  font-size: 1.5rem !important;
  font-weight: 700 !important;
  line-height: 1.45 !important;
  text-shadow: 0 1px 4px rgba(0,0,0,0.98), 0 0 3px #000 !important;
  padding: 6px 18px !important;
  border-radius: 5px !important;
}

/* DETAIL */
.detail-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 0 4% 32px;
  animation: slideUp 0.5s ease both 0.28s;
  opacity: 0; border-bottom: 1px solid var(--border);
}
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
@media(max-width: 768px) { .detail-grid { grid-template-columns: 1fr; gap: 24px; } }
.detail-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
}
.detail-desc { font-size: 14px; line-height: 1.8; color: var(--text-dim); }
.detail-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.btn-expand {
  background: none; border: none; color: var(--red);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
  font-weight: 600; cursor: pointer; padding: 8px 0 0; transition: opacity 0.2s;
}
.btn-expand:hover { opacity: 0.8; }
.detail-meta { display: flex; flex-direction: column; gap: 12px; }
.meta-row { display: flex; gap: 10px; align-items: baseline; }
.meta-label { font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 70px; }
.meta-value { font-size: 13px; color: var(--text-dim); }
.genre-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.genre-tag { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); font-size: 11px; font-weight: 600; color: var(--text-dim); }
.share-wrap { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn-share {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-share:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
.btn-share.wa { border-color: rgba(37,211,102,0.3); color: #25d366; }
.btn-share.wa:hover { background: rgba(37,211,102,0.08); }

/* CAST */
.cast-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 4% 32px;
  animation: slideUp 0.5s ease both 0.32s;
  opacity: 0; border-bottom: 1px solid var(--border);
}
.cast-scroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.cast-scroll::-webkit-scrollbar { display: none; }
.cast-card { flex: 0 0 90px; text-align: center; }
.cast-photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; border: 2px solid var(--border); display: block; background: var(--surface2); }
.cast-placeholder { width: 72px; height: 72px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; }
.cast-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-char { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* RECS */
.rec-wrap {
  max-width: 1280px; margin: 0 auto;
  padding: 0 4% 80px;
  animation: slideUp 0.5s ease both 0.35s;
  opacity: 0;
}
.rec-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 8px;
}
.rec-card {
  cursor: pointer; border-radius: 4px; overflow: hidden;
  transition: transform 0.25s;
}
.rec-card:hover { transform: scale(1.04); }
.rec-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
.rec-card-name {
  background: var(--surface); padding: 8px 10px;
  font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.fade-out { animation: fadeOut 0.35s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }

@media(max-width: 768px) {
  .video-box { padding: 0; }
  .video-frame { border-radius: 0; }
  .info-wrap { grid-template-columns: 1fr; gap: 24px; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">ANVI</a>
  <span class="sep">/</span>
  <span id="navTitle">Memuat…</span>
  <a href="index.html" class="close-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    Tutup
  </a>
</header>

<div class="main">
  <div class="player-wrap">
    <div class="video-box">
      <div class="video-frame">
        <div class="loader" id="loader"><div class="spin"></div></div>
        <div id="playerFrame"></div>
        <div id="subOverlay" class="sub-overlay"></div>
      </div>
    </div>
  </div>

  <div class="info-wrap">
    <div>
      <div class="info-title" id="vTitle">Memuat…</div>
      <div class="info-tags">
        <span class="tag tag-type" id="vType">Video</span>
        <span class="tag tag-quality">HD</span>
      </div>
      <!-- KONTROL SERVER & SUBTITLE (DROPDOWN) -->
      <div class="player-controls-row">
        <!-- PILIH SERVER -->
        <div class="control-group">
          <label class="control-label" for="serverSelect">Pilih Server</label>
          <div class="control-input-wrap">
            <div class="select-wrapper">
              <select id="serverSelect" class="custom-select" onchange="onServerSelectChange(this.value)">
                <option value="srv-1">Server 1</option>
              </select>
              <div class="select-arrow">
                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
              </div>
            </div>
            <button class="srv trailer" id="trailerBtn" onclick="playTrailer()">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Trailer
            </button>
          </div>
        </div>

        <!-- PILIHAN SUBTITLE -->
        <div class="control-group" id="subWrap" style="display:none">
          <label class="control-label" for="subtitleSelect">
            <span>Pilihan Subtitle</span>
            <span class="sub-status-badge" id="subStatus">Memuat...</span>
          </label>
          <div class="control-input-wrap">
            <div class="select-wrapper">
              <select id="subtitleSelect" class="custom-select" onchange="onSubtitleSelectChange(this.value)">
                <option value="-1">Nonaktif</option>
              </select>
              <div class="select-arrow">
                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
              </div>
            </div>
            <button class="btn-sub-upload" onclick="document.getElementById('customSubInput').click()" title="Unggah file .srt atau .vtt">
              + Unggah Subtitle
            </button>
            <input type="file" id="customSubInput" accept=".vtt,.srt" style="display:none" onchange="uploadCustomSubtitle(event)">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="detail-wrap" id="detailWrap" style="display:none">
    <div class="detail-grid">
      <div>
        <div class="detail-section-title">Sinopsis</div>
        <div class="detail-desc collapsed" id="detailDesc">—</div>
        <button class="btn-expand" id="btnExpand" onclick="toggleDesc()">Selengkapnya ▾</button>
        <div class="share-wrap">
          <button class="btn-share wa" onclick="shareWA()">

            WhatsApp
          </button>
          <button class="btn-share" onclick="copyLink()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Salin Link
          </button>
        </div>
      </div>
      <div class="detail-meta" id="detailMeta"></div>
    </div>
  </div>

  <div class="cast-wrap" id="castWrap" style="display:none">
    <div class="detail-section-title">Pemeran</div>
    <div class="cast-scroll" id="castList"></div>
  </div>

  <div class="rec-wrap">
    <div class="rec-title">Mungkin Kamu Suka</div>
    <div class="rec-grid" id="recGrid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xvktodveoxnuelhtzaog.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2a3RvZHZlb3hudWVsaHR6YW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzEzMjAsImV4cCI6MjA4NTM0NzMyMH0.WUvB6oKtKxxgO-5z0SH8uBUQx9c3Gn6r170qxGeKWTI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TMDB_KEY = '7bb2587bb70323fa478264264f16fcc7';
const TMDB_API = 'https://api.themoviedb.org/3';
const CF_WORKER = 'https://falling-credit-63e8.anvibot.workers.dev';
let trailerKey = null; // YouTube video key dari TMDB
const params = new URLSearchParams(location.search);

function goto(url) {
  document.body.classList.add('fade-out');
  setTimeout(() => location.href = url, 320);
}

async function init() {
  let data = null, title = '';
  const movieId = params.get('id');
  const episodeId = params.get('episode');

  if (movieId) {
    const r = await sb.from('Movies').select('*').eq('id', movieId).single();
    if (r.data) { data = r.data; title = r.data.title; document.getElementById('vType').innerText = 'Film'; }
  } else if (episodeId) {
    const r = await sb.from('Episodes').select('*, Series(id, title, thumb, imdb_id)').eq('id', episodeId).single();
    if (r.data) { data = r.data; title = `${r.data.Series.title} — Eps ${r.data.episode}`; document.getElementById('vType').innerText = 'Series'; }
  }

  if (!data) {
    document.getElementById('vTitle').innerText = 'Video tidak ditemukan.';
    setTimeout(() => goto('index.html'), 2000);
    return;
  }

  document.title = title + ' — Anvi';
  document.getElementById('navTitle').innerText = title;
  document.getElementById('vTitle').innerText = title;

let allServers = [];
let currentServerId = '';

// Deteksi nama provider dari URL secara otomatis
function getProviderName(url) {
  if (!url) return 'Server';
  const u = url.toLowerCase();
  if (u.includes('febbox.com'))         return 'FebBox';
  if (u.includes('vidsrc.to'))          return 'VidSrc';
  if (u.includes('vidsrc.me'))          return 'VidSrc Pro';
  if (u.includes('vidsrc.xyz'))         return 'VidSrc XYZ';
  if (u.includes('multiembed.mov'))     return 'MultiEmbed';
  if (u.includes('autoembed.co'))       return 'AutoEmbed';
  if (u.includes('2embed.cc'))          return '2Embed';
  if (u.includes('smashystream.com'))   return 'SmashyStream';
  if (u.includes('moviesapi.club'))     return 'MoviesAPI';
  if (u.includes('embed.su'))           return 'Embed.su';
  if (u.includes('nontongo.win'))       return 'NontonGo';
  if (u.includes('rivestream.live'))    return 'Rive';
  if (u.includes('streamtape.com'))     return 'Streamtape';
  if (u.includes('streamwish.com') || u.includes('strwish.com')) return 'StreamWish';
  if (u.includes('filemoon.sx') || u.includes('filemoon.in'))    return 'FileMoon';
  if (u.includes('dood.'))             return 'Doodstream';
  if (u.includes('drive.google.com') || u.includes('gdriveplayer')) return 'GDrive';
  if (u.includes('pixeldrain.com'))    return 'PixelDrain';
  if (u.includes('seekstreaming.com')) return 'SeekStreaming';
  if (u.includes('workers.dev') || u.includes('/stream?url=')) return 'CF Worker';
  // Fallback: ambil domain utama
  try {
    const host = new URL(url.startsWith('http') ? url : 'https://' + url).hostname;
    return host.replace('www.', '').split('.')[0];
  } catch { return 'Server'; }
}

function extractImdbId(url, directImdb) {
  if (directImdb && typeof directImdb === 'string' && directImdb.startsWith('tt')) {
    return directImdb.trim();
  }
  if (url && typeof url === 'string') {
    const m = url.match(/tt\d+/);
    if (m) return m[0];
  }
  return '';
}

function resolveStreamUrl(rawUrl) {
  if (!rawUrl) return '';
  let u = rawUrl.trim();

  // Jika URL adalah Cloudflare Worker /stream?url=...
  if (u.includes('/stream?url=')) {
    const parts = u.split('/stream?url=');
    const targetUrl = decodeURIComponent(parts[1] || '');
    if (targetUrl) {
      // Jika di server lokal, gunakan proxy lokal yang pasti tembus ISP
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        return `/proxy?url=${encodeURIComponent(targetUrl)}`;
      }
      return targetUrl;
    }
  }

  // Jika URL adalah amaystream proxy (/api/proxy?url=...)
  if (u.startsWith('/api/proxy')) {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const q = u.split('url=')[1];
      if (q) return `/proxy?url=${q}`;
    }
    return 'https://amaystream.vercel.app' + u;
  }

  return u;
}

function sanitizeServerUrl(url, imdbId, isMovie = true, season = 1, episode = 1) {
  if (!url) return '';
  let u = url.trim();
  const effectiveImdb = extractImdbId(u, imdbId);

  // Ganti host mati atau link kadaluarsa dengan embed aktif
  if (u.includes('streamimdb.ru') || u.includes('streamimdb.me') || u.includes('vidking.net') || (u.includes('shegu.net') && u.includes('sign='))) {
    if (effectiveImdb) {
      return isMovie
        ? `https://vidsrc.to/embed/movie/${effectiveImdb}`
        : `https://vidsrc.to/embed/tv/${effectiveImdb}/${season || 1}/${episode || 1}`;
    } else {
      return 'https://vidsrc.to';
    }
  }
  return u;
}

let autoSwitchTimer = null;
let autoSwitchAttempts = 0;

function tryNextServer(manual = false) {
  const currentIdx = allServers.findIndex(s => s.id === currentServerId);
  if (currentIdx !== -1 && currentIdx + 1 < allServers.length) {
    const nextServer = allServers[currentIdx + 1];
    if (!manual) {
      showPlayerNotice(`⚡ Server gagal — otomatis pindah ke ${nextServer.name}...`);
    }
    setTimeout(() => {
      currentServerId = nextServer.id;
      renderServerDropdown();
      playServer(nextServer);
    }, manual ? 0 : 1500);
  } else {
    clearAutoSwitchTimer();
    showPlayerNotice('Semua server telah dicoba. Film ini mungkin belum tersedia. Coba putar Trailer.', true);
  }
}

function startAutoSwitchTimer(serverName) {
  clearAutoSwitchTimer();
  // Tunggu 12 detik — jika iframe tidak memuat konten, otomatis pindah
  autoSwitchTimer = setTimeout(() => {
    const currentIdx = allServers.findIndex(s => s.id === currentServerId);
    if (currentIdx !== -1 && currentIdx + 1 < allServers.length) {
      tryNextServer();
    }
  }, 12000);
}

function clearAutoSwitchTimer() {
  if (autoSwitchTimer) {
    clearTimeout(autoSwitchTimer);
    autoSwitchTimer = null;
  }
}

function renderServerDropdown() {
  const sel = document.getElementById('serverSelect');
  if (!sel) return;

  sel.innerHTML = '';
  allServers.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    if (s.id === currentServerId) opt.selected = true;
    sel.appendChild(opt);
  });

  if (!currentServerId && allServers.length > 0) {
    currentServerId = allServers[0].id;
    sel.value = currentServerId;
  } else if (currentServerId) {
    sel.value = currentServerId;
  }
}

function onServerSelectChange(serverId) {
  const s = allServers.find(x => x.id === serverId);
  if (!s) return;
  currentServerId = s.id;
  clearAutoSwitchTimer(); // User memilih manual, batalkan auto-switch
  document.getElementById('trailerBtn')?.classList.remove('active');
  playServer(s);
}

function playServer(s) {
  clearAutoSwitchTimer();
  const u = resolveStreamUrl(s.url);
  // FebBox (type:'hls') atau URL direct stream
  const isDirectStream = s.type === 'hls' || s.type === 'm3u8' || s.type === 'mp4'
    || u.includes('.m3u8') || u.includes('.mp4')
    || u.includes('shegu.net') || u.includes('hakunaymatata.com');

  if (isDirectStream) {
    const streamType = s.type || (u.includes('.m3u8') ? 'hls' : 'mp4');
    playDirectStream(u, streamType);
    // Direct stream tidak perlu timer auto-switch
  } else {
    play(u);
    // Timer auto-switch untuk embed iframe
    const currentIdx = allServers.findIndex(x => x.id === currentServerId);
    if (currentIdx !== -1 && currentIdx + 1 < allServers.length) {
      startAutoSwitchTimer(s.name);
    }
  }
}

let playerHls = null;

function play(url) {
  if (playerHls) {
    playerHls.destroy();
    playerHls = null;
  }
  const loader = document.getElementById('loader');
  loader.style.opacity = '1'; loader.style.display = 'flex';

  let u = url.trim();

  // Jika input adalah direct stream video (.m3u8 atau .mp4), putar langsung via HTML5 Player
  if (u.includes('.m3u8') || u.includes('.mp4') || u.includes('shegu.net') || u.includes('hakunaymatata.com')) {
    playDirectStream(u, u.includes('.m3u8') ? 'hls' : 'mp4');
    return;
  }

  let iframeHtml = '';

  // ── Deteksi apakah input adalah embed code (<iframe ...>) ──
  if (u.startsWith('<iframe') || u.startsWith('<IFRAME')) {
    // Pakai langsung embed code-nya apa adanya
    iframeHtml = u;
  } else {
    // ── Input adalah URL biasa, konversi ke embed ──
    let extra = '';

    if (u.includes('streamtape.com')) {
      u = u.replace('/v/', '/e/').replace('/watch/', '/e/');
    }
    else if (u.includes('filemoon.sx') || u.includes('filemoon.in')) {
      u = u.replace('/d/', '/e/').replace('/f/', '/e/');
    }
    else if (u.match(/dood\.(to|la|sh|watch|pm|re|yt|stream)/)) {
      u = u.replace(/\/(d|f|watch)\//, '/e/');
    }
    else if (u.includes('streamwish.com') || u.includes('strwish.com')) {
      u = u.replace('/f/', '/e/').replace('/d/', '/e/');
    }
    else if (u.includes('seekstreaming.com')) {
      u = u.replace('/f/', '/e/').replace('/d/', '/e/');
    }
    else if (u.includes('pixeldrain.com')) {
      const id = u.split('/u/')[1]?.split('?')[0];
      if (id) u = `https://pixeldrain.com/api/file/${id}?download`;
    }
    else if (u.includes('drive.google.com')) {
      u = u.replace('/view', '/preview').replace('/edit', '/preview');
    }
    else if (u.includes('gdriveplayer')) {
      extra = 'referrerpolicy="no-referrer"';
    }

    iframeHtml = `<iframe src="${u}" frameborder="0" scrolling="0" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" ${extra}></iframe>`;
  }

  document.getElementById('playerFrame').innerHTML = iframeHtml;

  // Pasang listener onload di iframe: jika berhasil load, batalkan timer auto-switch
  const newIframe = document.querySelector('#playerFrame iframe');
  if (newIframe) {
    newIframe.addEventListener('load', () => {
      clearAutoSwitchTimer();
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    });
    newIframe.addEventListener('error', () => {
      tryNextServer();
    });
  }

  setTimeout(() => {
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
  }, 1800);
}

let availableSubtitles = [];
let activeSubtitleIndex = -1;
let currentSubBlobUrl = null;
let currentSubCues = [];
let streamsLoaded = false;
let subFetchToken = 0;   // guards against a slower, superseded subtitle fetch overwriting a newer selection
let fsTrackEl = null;    // native <track> element, only attached while in fullscreen

function isFullscreenNow() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

/**
 * Draw the currently active cue (if any) into the custom overlay.
 * Hidden whenever fullscreen is active — fullscreen uses the native track instead,
 * since our overlay div lives outside the fullscreened <video> and can't render there.
 */
function renderSubtitleOverlay(video) {
  const overlay = document.getElementById('subOverlay');
  if (!overlay || !video) return;

  if (isFullscreenNow() || activeSubtitleIndex === -1 || !currentSubCues.length) {
    overlay.classList.remove('visible');
    overlay.style.display = 'none';
    overlay.textContent = '';
    return;
  }

  const cur = video.currentTime;
  const active = currentSubCues.find(c => cur >= c.start && cur <= c.end);
  if (!active) {
    overlay.classList.remove('visible');
    setTimeout(() => { if (!overlay.classList.contains('visible')) { overlay.style.display = 'none'; overlay.textContent = ''; } }, 180);
    return;
  }

  const lines = active.text
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0);

  overlay.textContent = '';
  lines.forEach(l => {
    const span = document.createElement('span');
    span.className = 'sub-line';
    span.textContent = l; // textContent, not innerHTML — subtitle text comes from an external, untrusted source
    overlay.appendChild(span);
  });
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('visible'));
}

/** Remove the native track (if any), disable native rendering, and clear the custom overlay. */
function teardownSubtitleRendering(video) {
  if (fsTrackEl) { fsTrackEl.remove(); fsTrackEl = null; }
  if (video && video.textTracks) {
    for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'disabled';
  }
  const overlay = document.getElementById('subOverlay');
  if (overlay) { overlay.classList.remove('visible'); overlay.style.display = 'none'; overlay.textContent = ''; }
}

/**
 * Switch rendering strategy based on fullscreen state:
 *  - Fullscreen: attach a native <track> in 'showing' mode (styled by the :fullscreen ::cue CSS)
 *    and hide the custom overlay, since it can't render outside the fullscreened <video>.
 *  - Normal view: no native track at all (avoids racing the browser's own default-track
 *    rendering), the custom overlay handles everything via renderSubtitleOverlay().
 */
function syncFullscreenSubtitleTrack() {
  const video = document.getElementById('nativePlayer');
  if (!video) return;

  if (isFullscreenNow() && activeSubtitleIndex > -1 && currentSubBlobUrl) {
    if (!fsTrackEl || !video.contains(fsTrackEl)) {
      video.querySelectorAll('track').forEach(t => t.remove());
      fsTrackEl = document.createElement('track');
      fsTrackEl.kind = 'subtitles';
      const sub = availableSubtitles[activeSubtitleIndex];
      fsTrackEl.label = sub ? sub.displayLabel : 'Subtitle';
      fsTrackEl.srclang = (sub && sub.lang) || 'id';
      fsTrackEl.src = currentSubBlobUrl;
      video.appendChild(fsTrackEl);
      const showTrack = () => {
        if (video.textTracks) for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'showing';
      };
      fsTrackEl.addEventListener('load', showTrack);
      setTimeout(showTrack, 150); // fallback: <track> load/error events are unreliable for blob: URLs on some browsers
    }
    const overlay = document.getElementById('subOverlay');
    if (overlay) { overlay.classList.remove('visible'); overlay.style.display = 'none'; overlay.textContent = ''; }
  } else {
    if (fsTrackEl) { fsTrackEl.remove(); fsTrackEl = null; }
    if (video.textTracks) for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'disabled';
    renderSubtitleOverlay(video);
  }
}

document.addEventListener('fullscreenchange', syncFullscreenSubtitleTrack);
document.addEventListener('webkitfullscreenchange', syncFullscreenSubtitleTrack);

function categorizeSubtitles(subsList) {
  if (!Array.isArray(subsList)) return [];
  const categorized = [];
  const seenUrls = new Set();

  subsList.forEach(s => {
    if (!s || !s.file || seenUrls.has(s.file)) return;
    seenUrls.add(s.file);

    const label = (s.label || '').trim();
    const l = (label + ' ' + (s.lang || '')).toLowerCase();

    let langName = 'Lainnya';
    let langCode = 'xx';
    let isIndo = false;

    if (s.isIndonesian || l.includes('indonesia') || l === 'ind' || l.startsWith('ind') || l.includes('indonesian')) {
      langName = 'Indonesia';
      langCode = 'id';
      isIndo = true;
    } else if (l.includes('english') || l === 'eng' || l.startsWith('eng') || l.includes('(sdh)')) {
      langName = 'English';
      langCode = 'en';
    } else if (l.includes('bengali') || l === 'ben') {
      langName = 'Bengali';
      langCode = 'bn';
    } else if (l.includes('spanish') || l === 'spa') {
      langName = 'Spanish';
      langCode = 'es';
    } else if (l.includes('arabic') || l === 'ara') {
      langName = 'Arabic';
      langCode = 'ar';
    } else {
      langName = label || 'Subtitle';
    }

    categorized.push({
      label: label || langName,
      displayLabel: langName,
      lang: langCode,
      url: s.file,
      isIndo
    });
  });

  categorized.sort((a, b) => {
    if (a.isIndo && !b.isIndo) return -1;
    if (!a.isIndo && b.isIndo) return 1;
    if (a.lang === 'en' && b.lang !== 'en') return -1;
    if (a.lang !== 'en' && b.lang === 'en') return 1;
    return 0;
  });

  return categorized;
}

function parseTimestamp(t) {
  const clean = t.trim().split(' ')[0];
  const p = clean.split(':');
  if (p.length === 3) {
    return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2].replace(',', '.'));
  } else if (p.length === 2) {
    return parseFloat(p[0]) * 60 + parseFloat(p[1].replace(',', '.'));
  }
  return NaN;
}

function parseSubtitleCues(rawText) {
  const cues = [];
  const normalized = rawText.replace(/\r\n|\r/g, '\n');
  const blocks = normalized.split(/\n\s*\n/);

  for (const block of blocks) {
    const lines = block.trim().split('\n');
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const parts = timeLine.split('-->');
    const start = parseTimestamp(parts[0].trim());
    const end = parseTimestamp(parts[1].trim());
    const timeIdx = lines.indexOf(timeLine);
    const cueText = lines.slice(timeIdx + 1).join('<br>').replace(/<font[^>]*>/gi, '').replace(/<\/font>/gi, '').trim();
    if (cueText && !isNaN(start) && !isNaN(end)) {
      cues.push({ start, end, text: cueText });
    }
  }
  return cues;
}

function convertToWebVTT(rawText) {
  if (!rawText) return '';
  let clean = rawText.trim().replace(/\r\n|\r/g, '\n');
  if (clean.startsWith('WEBVTT')) return clean;

  return 'WEBVTT\n\n' + clean
    .replace(/(\d{1,2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2')
    .replace(/(\d{1,2}:\d{2}),(\d{3})/g, '$1.$2');
}

async function applySubtitle(subObj, index) {
  const myToken = ++subFetchToken; // invalidates any still-in-flight fetch from an earlier selection
  activeSubtitleIndex = index;
  renderSubtitleDropdown();

  const statusBadge = document.getElementById('subStatus');
  const video = document.getElementById('nativePlayer');

  if (currentSubBlobUrl && currentSubBlobUrl.startsWith('blob:')) {
    try { URL.revokeObjectURL(currentSubBlobUrl); } catch(e) {}
  }
  currentSubBlobUrl = null;
  currentSubCues = [];
  teardownSubtitleRendering(video);

  if (!subObj) {
    if (statusBadge) statusBadge.innerText = 'Nonaktif';
    return;
  }

  if (statusBadge) statusBadge.innerText = 'Memuat ' + subObj.displayLabel + '...';

  try {
    let rawText = '';
    try {
      const res = await fetch(subObj.url);
      if (!res.ok) throw new Error('Status ' + res.status);
      rawText = await res.text();
    } catch(err) {
      const proxyRes = await fetch('https://corsproxy.io/?' + encodeURIComponent(subObj.url));
      rawText = await proxyRes.text();
    }

    if (myToken !== subFetchToken) return; // a newer subtitle selection has already taken over

    if (rawText) {
      currentSubCues = parseSubtitleCues(rawText);

      const vtt = convertToWebVTT(rawText);
      const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
      currentSubBlobUrl = URL.createObjectURL(blob);

      syncFullscreenSubtitleTrack(); // attaches the native track only if currently fullscreen
      if (video) renderSubtitleOverlay(video); // shows immediately when not fullscreen

      if (statusBadge) statusBadge.innerText = 'Aktif: ' + subObj.displayLabel;
    }
  } catch(err) {
    if (myToken !== subFetchToken) return;
    console.error('Gagal memuat subtitle:', err);
    if (statusBadge) statusBadge.innerText = 'Gagal memuat';
  }
}

function renderSubtitleDropdown() {
  const wrap = document.getElementById('subWrap');
  const sel = document.getElementById('subtitleSelect');
  const statusBadge = document.getElementById('subStatus');
  if (!wrap || !sel) return;

  if (!availableSubtitles.length) {
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'flex';
  sel.innerHTML = '';

  // 1. Subtitles tracks (Indonesia diutamakan di paling atas)
  const langCounts = {};
  availableSubtitles.forEach((sub, idx) => {
    langCounts[sub.displayLabel] = (langCounts[sub.displayLabel] || 0) + 1;
    const countSuffix = langCounts[sub.displayLabel] > 1 ? ' ' + langCounts[sub.displayLabel] : '';
    const opt = document.createElement('option');
    opt.value = idx.toString();
    opt.textContent = `${sub.displayLabel}${countSuffix}`;
    if (activeSubtitleIndex === idx) opt.selected = true;
    sel.appendChild(opt);
  });

  // 2. Opsi Nonaktif
  const offOpt = document.createElement('option');
  offOpt.value = '-1';
  offOpt.textContent = 'Nonaktif (Tanpa Subtitle)';
  if (activeSubtitleIndex === -1) offOpt.selected = true;
  sel.appendChild(offOpt);

  if (activeSubtitleIndex >= 0 && availableSubtitles[activeSubtitleIndex]) {
    sel.value = activeSubtitleIndex.toString();
    if (statusBadge) statusBadge.innerText = 'Aktif: ' + availableSubtitles[activeSubtitleIndex].displayLabel;
  } else {
    sel.value = '-1';
    if (statusBadge) statusBadge.innerText = 'Nonaktif';
  }
}

function onSubtitleSelectChange(valStr) {
  const idx = parseInt(valStr, 10);
  if (idx === -1) {
    applySubtitle(null, -1);
  } else if (availableSubtitles[idx]) {
    applySubtitle(availableSubtitles[idx], idx);
  }
}

function uploadCustomSubtitle(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const vtt = convertToWebVTT(text);
    const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);
    const customSub = {
      label: file.name,
      displayLabel: 'Kustom (' + file.name.slice(0, 15) + ')',
      lang: 'id',
      url: blobUrl,
      isIndo: true
    };
    availableSubtitles.unshift(customSub);
    applySubtitle(customSub, 0); // re-fetches the blob URL, which also runs it through the same parse/track path as remote subtitles
  };
  reader.readAsText(file);
}


function playDirectStream(url, type) {
  const loader = document.getElementById('loader');
  loader.style.opacity = '1'; loader.style.display = 'flex';

  if (playerHls) {
    playerHls.destroy();
    playerHls = null;
  }
  fsTrackEl = null; // the <video> below is freshly created; any previous track element is gone with it

  let targetUrl = resolveStreamUrl(url);

  const container = document.getElementById('playerFrame');
  container.innerHTML = `
    <video id="nativePlayer" controls autoplay playsinline
      style="position:absolute;inset:0;width:100%;height:100%;background:#000;border-radius:6px">
    </video>
  `;

  const video = document.getElementById('nativePlayer');

  // Pasang timeupdate listener untuk subtitle overlay (no-op while fullscreen; native track takes over then)
  video.ontimeupdate = () => renderSubtitleOverlay(video);

  // Terapkan subtitle aktif jika sudah terpilih
  if (activeSubtitleIndex > -1 && availableSubtitles[activeSubtitleIndex]) {
    applySubtitle(availableSubtitles[activeSubtitleIndex], activeSubtitleIndex);
  }

  const isHls = type === 'hls' || type === 'm3u8' || targetUrl.includes('.m3u8');

  if (isHls && window.Hls && Hls.isSupported()) {
    playerHls = new Hls({ enableWorker: true });
    playerHls.loadSource(targetUrl);
    playerHls.attachMedia(video);
    playerHls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 400);
    });
    playerHls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        console.warn('HLS stream error:', data);
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
        tryNextServer();
      }
    });
  } else {
    video.src = targetUrl;
    video.onloadeddata = () => {
      video.play().catch(() => {});
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 400);
    };
    video.onerror = () => {
      console.warn('Video stream load error:', targetUrl);
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 400);
      tryNextServer();
    };
  }
}

async function loadRecs() {

  const grid = document.getElementById('recGrid');
  data?.forEach(r => {

async function loadTrailer(title, isMovie) {
  try {
    const cleanTitle = title.replace(/\s*\(\d{4}\)\s*$/, '').trim();
    const year = (title.match(/\((\d{4})\)/) || [])[1] || '';
    const type = isMovie ? 'movie' : 'tv';

    // Search TMDB
    const sRes = await fetch(`${TMDB_API}/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanTitle)}${year ? '&year='+year : ''}`);
    const sData = await sRes.json();
    const first = sData.results?.[0];
    if (!first) return;

    // Load direct streaming sources and subtitles from AmayStream API
    if (!streamsLoaded) {
      loadApiStreams(first.id, isMovie);
    }

    // Fetch detail + credits + videos sekaligus
    const [detailRes, creditsRes, videosRes] = await Promise.all([
      fetch(`${TMDB_API}/${type}/${first.id}?api_key=${TMDB_KEY}&language=id-ID`),
      fetch(`${TMDB_API}/${type}/${first.id}/credits?api_key=${TMDB_KEY}&language=id-ID`),
      fetch(`${TMDB_API}/${type}/${first.id}/videos?api_key=${TMDB_KEY}`)
    ]);
    const detail  = await detailRes.json();
    const credits = await creditsRes.json();
    const videos  = await videosRes.json();

    // ── Trailer ──
    const trailer = (videos.results||[]).find(v => v.site==='YouTube' && v.type==='Trailer')
                 || (videos.results||[]).find(v => v.site==='YouTube' && v.type==='Teaser')
                 || (videos.results||[]).find(v => v.site==='YouTube');
    if (trailer) {
      trailerKey = trailer.key;
      document.getElementById('trailerBtn').classList.add('show');
    }

    // ── Detail Info ──
    const desc    = detail.overview || '';
    const genres  = (detail.genres||[]).map(g => g.name).join(', ');
    const releaseY = (detail.release_date || detail.first_air_date || '').slice(0,4);
    const runtime = detail.runtime ? `${detail.runtime} menit` : (detail.episode_run_time?.[0] ? `${detail.episode_run_time[0]} menit/eps` : '—');
    const rating  = detail.vote_average ? detail.vote_average.toFixed(1) + ' / 10' : '—';
    const director = (credits.crew||[]).find(c => c.job === 'Director')?.name || '—';

    if (desc) {
      document.getElementById('detailDesc').innerText = desc;
      document.getElementById('detailWrap').style.display = 'block';

      // Meta info
      const meta = document.getElementById('detailMeta');
      meta.innerHTML = `
        ${releaseY ? `<div class="meta-row"><span class="meta-label">Tahun</span><span class="meta-value">${releaseY}</span></div>` : ''}
        ${genres ? `<div class="meta-row"><span class="meta-label">Genre</span><div class="genre-tags">${genres.split(', ').map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div></div>` : ''}
        <div class="meta-row"><span class="meta-label">Durasi</span><span class="meta-value">${runtime}</span></div>
        <div class="meta-row"><span class="meta-label">Rating</span><span class="meta-value">${rating}</span></div>
        ${director !== '—' ? `<div class="meta-row"><span class="meta-label">Sutradara</span><span class="meta-value">${director}</span></div>` : ''}
      `;
    }

    // ── Cast ──
    const cast = (credits.cast||[]).slice(0, 15);
    if (cast.length) {
      const castList = document.getElementById('castList');
      cast.forEach((c, i) => {
        const photo = c.profile_path ? `https://image.tmdb.org/t/p/w185${c.profile_path}` : '';
        castList.innerHTML += `
          <div class="cast-card" style="animation-delay:${i*0.04}s">
            ${photo
              ? `<img class="cast-photo" src="${photo}" loading="lazy" alt="${c.name}">`
              : `<div class="cast-placeholder"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" opacity="0.35"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>`}
            <div class="cast-name">${c.name}</div>
            <div class="cast-char">${c.character || ''}</div>
          </div>`;
      });
      document.getElementById('castWrap').style.display = 'block';
    }

  } catch(e) {
    console.warn('TMDB error:', e.message);
  }
}

async function initStreamsAndSubtitles(itemData, isMovie) {
  try {
    let tmdbId = null;
    let season = 1;
    let episode = 1;

    if (!isMovie) {
      season = itemData.season || 1;
      episode = itemData.episode || 1;
    }

    const imdbId = isMovie ? itemData.imdb : (itemData.Series?.imdb_id || itemData.imdb);
    if (imdbId) {
      try {
        const findRes = await fetch(`${TMDB_API}/find/${imdbId}?api_key=${TMDB_KEY}&external_source=imdb_id`);
        const findData = await findRes.json();
        const results = isMovie ? findData.movie_results : findData.tv_results;
        if (results && results.length > 0) {
          tmdbId = results[0].id;
        }
      } catch (err) {
        console.warn('Find by IMDB error:', err);
      }
    }

    if (!tmdbId) {
      const rawTitle = isMovie ? itemData.title : (itemData.Series?.title || itemData.title || '');
      const cleanTitle = rawTitle.replace(/\s*\(\d{4}\)\s*$/, '').trim();
      const year = (rawTitle.match(/\((\d{4})\)/) || [])[1] || '';
      const type = isMovie ? 'movie' : 'tv';
      const sRes = await fetch(`${TMDB_API}/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanTitle)}${year ? '&year='+year : ''}`);
      const sData = await sRes.json();
      if (sData.results && sData.results.length > 0) {
        tmdbId = sData.results[0].id;
      }
    }

    if (tmdbId) {
      await loadApiStreams(tmdbId, isMovie, season, episode);
    }
  } catch (err) {
    console.error('initStreamsAndSubtitles error:', err);
  }
}

async function loadApiStreams(tmdbId, isMovie, season = 1, episode = 1) {
  if (streamsLoaded) return;
  streamsLoaded = true;

  try {
    const endpoint = isMovie
      ? `https://amaystream.vercel.app/api/v1/movie?id=${tmdbId}&tmdbApiKey=${TMDB_KEY}&cfWorker=${CF_WORKER}`
      : `https://amaystream.vercel.app/api/v1/tv?id=${tmdbId}&season=${season}&episode=${episode}&tmdbApiKey=${TMDB_KEY}&cfWorker=${CF_WORKER}`;

    const res = await fetch(endpoint);
    const data = await res.json();

    // ── 1. Proses Subtitle ──
    if (data.subtitles && Array.isArray(data.subtitles) && data.subtitles.length > 0) {
      availableSubtitles = categorizeSubtitles(data.subtitles);
      renderSubtitleDropdown();

      // Pilih subtitle Bahasa Indonesia sebagai default jika tersedia
      const indoIdx = availableSubtitles.findIndex(s => s.isIndo);
      const defaultIdx = indoIdx !== -1 ? indoIdx : 0;
      activeSubtitleIndex = defaultIdx;
      applySubtitle(availableSubtitles[defaultIdx], defaultIdx);
    } else {
      const statusBadge = document.getElementById('subStatus');
      if (statusBadge) statusBadge.innerText = 'Tidak tersedia';
    }

    // ── 2. Proses Sumber Streaming ──
    if (data.success && data.sources && data.sources.length) {
      const validSources = data.sources.filter(s => {
        if (!s || !s.url) return false;
        const l = (s.label || '').toLowerCase();
        const src = (s.source || '').toLowerCase();
        const u = s.url.toLowerCase();
        if (src.includes('dulo') || l.includes('dulo')) return false;
        if (u.includes('bluevelvet.space') || u.includes('zstream-proxy')) return false;
        if (u.includes('test.workers.dev')) return false;
        if (src.includes('streamaggregator') || u.includes('streamaggregator.in')) return false;
        if (u.includes('flcwuk.com') || u.includes('hlowxn.com') || u.includes('bhcoxn.com') || u.includes('klcoxn.com') || u.includes('bwcvxn.com') || u.includes('mlcoxn.com')) return false;
        return true;
      });

      // ── Sisipkan FebBox & VIP sources di PALING ATAS allServers ──
      const newTopServers = [];
      validSources.slice(0, 4).forEach((s, idx) => {
        const label = `${s.label || s.source || 'VIP Stream'} (${s.quality || 'HD'})`;
        const resolved = resolveStreamUrl(s.url);
        if (!allServers.some(x => x.url === resolved || x.url === s.url)) {
          newTopServers.push({
            id: 'api-' + idx,
            name: label,
            url: resolved,
            type: s.type || (resolved.includes('.m3u8') ? 'hls' : 'mp4')
          });
        }
      });

      // Sisipkan di posisi 0 (paling atas)
      allServers.unshift(...newTopServers);

      // Update server aktif ke yang pertama (FebBox)
      if (newTopServers.length > 0) {
        currentServerId = allServers[0].id;
        renderServerDropdown();
        playServer(allServers[0]);
      } else {
        renderServerDropdown();
      }
    }
  } catch(e) {
    console.warn('AmayStream API error:', e.message);
  }
}
