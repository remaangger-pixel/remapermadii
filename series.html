<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series — Anvi Create</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1f1f1f;
  --red: #e50914; --text: #fff;
  --text-dim: rgba(255,255,255,0.65); --text-muted: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.08);
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  opacity: 0; animation: fadeIn 0.5s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: 64px; padding: 0 4%;
  display: flex; align-items: center; gap: 20px;
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 2px; color: var(--red);
  text-decoration: none;
}
.back-link {
  display: flex; align-items: center; gap: 7px;
  color: var(--text-dim); font-size: 13px; font-weight: 500;
  text-decoration: none; transition: color 0.2s;
  border: 1px solid var(--border); padding: 7px 16px; border-radius: 4px;
}
.back-link:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }

/* BILLBOARD */
.billboard {
  height: 72vh; min-height: 440px;
  position: relative; overflow: hidden;
  display: flex; align-items: flex-end;
  padding: 0 4% 60px;
}
.bb-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  animation: zoomBg 18s ease-in-out infinite alternate;
}
@keyframes zoomBg { from { transform: scale(1); } to { transform: scale(1.06); } }
.bb-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(to top, #0a0a0a 0%, rgba(10,10,10,0.75) 35%, rgba(10,10,10,0.15) 70%, transparent 100%),
    linear-gradient(to right, rgba(10,10,10,0.8) 0%, transparent 60%);
}
.bb-content {
  position: relative; z-index: 2; max-width: 520px;
  animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) both 0.2s;
  opacity: 0;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.bb-label {
  font-size: 12px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--red); margin-bottom: 12px;
}
.bb-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(44px, 7vw, 76px); letter-spacing: 2px; line-height: 0.95;
  margin-bottom: 16px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.ep-count {
  font-size: 14px; font-weight: 500; color: var(--text-dim);
  display: flex; align-items: center; gap: 8px;
}
.ep-count::before {
  content: ''; width: 20px; height: 2px; background: var(--red);
}

/* EPISODE LIST */
.episodes-section {
  max-width: 1200px; margin: 0 auto;
  padding: 40px 4% 80px;
  animation: slideUp 0.5s ease both 0.3s;
  opacity: 0;
}
.ep-section-title {
  font-size: 20px; font-weight: 700;
  margin-bottom: 20px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.ep-count-badge {
  font-size: 12px; font-weight: 500; color: var(--text-muted);
}

.ep-list { display: flex; flex-direction: column; gap: 4px; }

.ep-item {
  display: flex; align-items: center; gap: 20px;
  padding: 16px 18px; border-radius: 4px;
  cursor: pointer; transition: background 0.2s;
  border-bottom: 1px solid var(--border);
  animation: fadeItem 0.4s ease both;
}
.ep-item:hover { background: var(--surface); }
@keyframes fadeItem {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}

.ep-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 1px;
  color: var(--text-muted);
  min-width: 40px; text-align: center;
}
.ep-item:hover .ep-number { color: var(--red); }

.ep-thumb-wrap {
  position: relative; flex-shrink: 0;
  width: 130px; height: 73px; border-radius: 4px; overflow: hidden;
  background: var(--surface2);
}
.ep-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.ep-play-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
}
.ep-item:hover .ep-play-overlay { opacity: 1; }
.ep-play-icon {
  width: 36px; height: 36px; background: rgba(229,9,20,0.9);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.ep-play-icon svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }

.ep-info { flex: 1; }
.ep-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.ep-sub { font-size: 13px; color: var(--text-muted); }

.ep-duration {
  font-size: 12px; color: var(--text-muted); flex-shrink: 0;
}

.fade-out { animation: fadeOut 0.35s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }

@media(max-width: 768px) {
  .ep-thumb-wrap { width: 90px; height: 50px; }
  .ep-item { padding: 12px 12px; gap: 12px; }
  .ep-number { font-size: 20px; min-width: 28px; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">ANVI</a>
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Kembali
  </a>
</header>

<div class="billboard">
  <div class="bb-bg" id="bbBg"></div>
  <div class="bb-content">
    <div class="bb-label">TV Series</div>
    <div class="bb-title" id="bbTitle">Memuat…</div>
    <div class="ep-count" id="epCount">0 Episode</div>
  </div>
</div>

<div class="episodes-section">
  <div class="ep-section-title">
    <span>Episode</span>
    <span class="ep-count-badge" id="epBadge">—</span>
  </div>
  <div class="ep-list" id="epList"></div>
</div>

<script>
const SUPABASE_URL = "https://xvktodveoxnuelhtzaog.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2a3RvZHZlb3hudWVsaHR6YW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzEzMjAsImV4cCI6MjA4NTM0NzMyMH0.WUvB6oKtKxxgO-5z0SH8uBUQx9c3Gn6r170qxGeKWTI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const seriesId = new URLSearchParams(location.search).get('id');

function goto(url) {
  document.body.classList.add('fade-out');
  setTimeout(() => location.href = url, 320);
}

async function init() {
  if (!seriesId) return goto('index.html');

  const { data: s } = await sb.from('Series').select('*').eq('id', seriesId).single();
  if (!s) return goto('index.html');

  document.title = s.title + ' — Anvi';
  document.getElementById('bbBg').style.backgroundImage = `url(${s.thumb})`;
  document.getElementById('bbTitle').innerText = s.title;

  const { data: eps } = await sb.from('Episodes').select('*').eq('series_id', seriesId).order('episode', { ascending: true });
  const count = eps?.length || 0;
  document.getElementById('epCount').innerText = count + ' Episode';
  document.getElementById('epBadge').innerText = count + ' Episode';

  const list = document.getElementById('epList');
  if (!count) {
    list.innerHTML = '<p style="color:rgba(255,255,255,0.35);padding:30px 0">Belum ada episode tersedia.</p>';
    return;
  }

  eps.forEach((ep, i) => {
    const item = document.createElement('div');
    item.className = 'ep-item';
    item.style.animationDelay = (i * 0.05) + 's';
    item.innerHTML = `
      <div class="ep-number">${ep.episode}</div>
      <div class="ep-thumb-wrap">
        <img class="ep-thumb" src="${s.thumb}" loading="lazy" alt="Episode ${ep.episode}">
        <div class="ep-play-overlay">
          <div class="ep-play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="ep-info">
        <div class="ep-name">Episode ${ep.episode}${ep.title ? ' — ' + ep.title : ''}</div>
        <div class="ep-sub">${ep.title || 'Tonton sekarang di Anvi Create'}</div>
      </div>`;
    item.onclick = () => goto('player.html?episode=' + ep.id);
    list.appendChild(item);
  });
}

init();
</script>
</body>
</html>
