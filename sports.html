<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sports – Remapermadii</title>
  <meta name="description" content="Live sports streaming page powered by AmayStream integration." />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #eee;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      padding: 1rem 2rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    h1 { margin: 0; font-size: 2rem; }
    .iframe-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    iframe {
      border: none;
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    footer {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      background: #111;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Live Sports</h1>
  </header>
  <div class="iframe-wrapper">
    <!-- Embed AmayStream sports page -->
    <iframe src="https://amaystream.vercel.app/sports" loading="lazy" allowfullscreen></iframe>
  </div>
  <footer>
    <p>Powered by <a href="https://amaystream.vercel.app" target="_blank" rel="noopener">AmayStream</a>.</p>
  </footer>
</body>
</html>
